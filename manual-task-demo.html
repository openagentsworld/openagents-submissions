<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2338bdf8'/%3E%3C/svg%3E">
  <title>OpenAgents Manual Submission Test</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08111f;
      color: #e8f0ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 42%),
        #08111f;
    }

    main {
      width: min(100%, 520px);
      padding: clamp(24px, 6vw, 44px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(1.75rem, 7vw, 2.6rem);
      line-height: 1.1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 14px;
      border: 1px solid #4ade80;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      font-weight: 700;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #38bdf8;
      color: #082f49;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    button:focus-visible {
      outline: 3px solid #e0f2fe;
      outline-offset: 3px;
    }

    #result {
      min-height: 24px;
      margin: 18px 0 0;
      color: #bbf7d0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>OpenAgents Manual Submission Test</h1>
    <span id="status" class="status" role="status">Ready</span>
    <button id="complete-test" type="button">Complete Test</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const button = document.getElementById('complete-test');

    button.addEventListener('click', () => {
      status.textContent = 'Completed';
      result.textContent = 'Manual test completed successfully.';
    });
  </script>
</body>
</html>
