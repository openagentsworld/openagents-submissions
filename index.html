<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Counter</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #17315c, #070b16 65%);
      color: #f8fbff;
    }
    main {
      width: min(92vw, 420px);
      padding: 42px 30px;
      border: 1px solid rgba(125, 211, 252, .28);
      border-radius: 24px;
      background: rgba(9, 17, 34, .88);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
      text-align: center;
    }
    h1 { margin: 0 0 22px; font-size: clamp(1.5rem, 5vw, 2.1rem); }
    output { display: block; margin-bottom: 26px; font-size: 5rem; font-weight: 800; color: #67e8f9; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    #increment { background: linear-gradient(135deg, #22d3ee, #34d399); color: #04151b; }
    #reset { background: #27344c; color: #fff; }
    button:focus-visible { outline: 3px solid #facc15; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Interactive Counter</h1>
    <output id="count" aria-live="polite">0</output>
    <div class="actions">
      <button id="increment" type="button">+1</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </main>
  <script>
    const count = document.querySelector('#count');
    let value = 0;
    document.querySelector('#increment').addEventListener('click', () => {
      value += 1;
      count.textContent = String(value);
    });
    document.querySelector('#reset').addEventListener('click', () => {
      value = 0;
      count.textContent = '0';
    });
  </script>
</body>
</html>
